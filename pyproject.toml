[project]
name = "pilot-three"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi[standard]>=0.128.0",
    "flet[all]>=0.80.4",
    "httpx>=0.28.1",
    "sqlmodel>=0.0.31",
]


[dependency-groups]
dev = [
    "flet-cli>=0.80.4",
    "flet-desktop-light>=0.80.4",
    "flet-web>=0.80.4",
]

[tool.flet]
org = "com.mycompany"
product = "frontend"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"

[tool.flet.app]
path = "frontend/src"